<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AIPCA Thika Cathedral Software{% endblock %}</title>
<style>
  :root{
    --ink:#1d2733; --muted:#5d6978; --page:#f5f6f8; --surface:#ffffff; --line:#d8dce2;
    --accent:#7b2142; --accent-dark:#5e1832; --ok:#1f6b4a; --ok-bg:#e6f3ec;
    --err:#a32626; --err-bg:#fbeaea;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
       font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; min-height:100vh;}
  h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.2;margin:0 0 1rem}
  h1{font-size:1.75rem} h2{font-size:1.25rem}
  a{color:var(--accent)}
  header{background:var(--surface);border-bottom:1px solid var(--line)}
  .bar{max-width:960px;margin:0 auto;padding:.75rem 1rem;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.25rem}
  .brand{font-family:Georgia,serif;font-weight:700;font-size:1.15rem;margin-right:auto}
  nav{display:flex;flex-wrap:wrap;gap:.25rem 1rem;align-items:center}
  nav a{text-decoration:none;color:var(--ink);padding:.25rem 0;border-bottom:2px solid transparent}
  nav a:hover,nav a.on{border-bottom-color:var(--accent)}
  main{max-width:960px;margin:0 auto;padding:1.5rem 1rem 3rem;flex:1;}
  footer{background:var(--surface);border-top:1px solid var(--line);padding:1rem 0;text-align:center;color:var(--muted);font-size:0.9rem;}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1.25rem}
  .row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:end;margin-bottom:1rem}
  label{display:block;font-weight:600;margin-bottom:.25rem}
  input,select,textarea{font:inherit;color:inherit;width:100%;padding:.55rem .65rem;border:1px solid var(--line);border-radius:6px;background:#fff}
  textarea{min-height:9rem;resize:vertical}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #c9a0b3;outline-offset:1px}
  .grow{flex:1 1 200px}
  button,.btn{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;
              padding:.55rem 1rem;border-radius:6px;text-decoration:none;display:inline-block}
  button:hover,.btn:hover{background:var(--accent-dark)}
  .ghost{background:transparent;color:var(--accent)} .ghost:hover{background:#f3e8ed}
  .danger{background:transparent;color:var(--err);border-color:var(--err)} .danger:hover{background:var(--err-bg)}
  .small{padding:.25rem .6rem;font-size:.9rem}
  .linkbtn{background:none;border:0;color:var(--ink);padding:.25rem 0;font-weight:400;border-radius:0}
  .linkbtn:hover{background:none;color:var(--accent)}
  .flash{padding:.7rem 1rem;border-radius:6px;margin-bottom:1rem}
  .flash.ok{background:var(--ok-bg);color:var(--ok)} .flash.error{background:var(--err-bg);color:var(--err)}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:.6rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-weight:600;color:var(--muted);font-size:.9rem}
  .actions{white-space:nowrap;display:flex;gap:.4rem}
  .actions form{margin:0}
  .muted{color:var(--muted)} .count{font-size:.9rem}
  .narrow{max-width:420px;margin:3rem auto}
  .field{margin-bottom:1rem}
</style>
</head>
<body>
{% if session.admin_id %}
<header><div class="bar">
  <span class="brand">AIPCA Thika Cathedral</span>
  <nav>
    <a href="{{ url_for('members') }}" {% if request.endpoint in ('members','member_new','member_edit') %}class="on"{% endif %}>Members</a>
    <a href="{{ url_for('fellowships') }}" {% if request.endpoint in ('fellowships','fellowship_edit') %}class="on"{% endif %}>Fellowships</a>
    <a href="{{ url_for('send') }}" {% if request.endpoint=='send' %}class="on"{% endif %}>Send message</a>
    <a href="{{ url_for('history') }}" {% if request.endpoint=='history' %}class="on"{% endif %}>History</a>
    <a href="{{ url_for('import_members') }}" {% if request.endpoint=='import_members' %}class="on"{% endif %}>Import</a>
    <form method="post" action="{{ url_for('logout') }}" style="margin:0">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <button class="linkbtn" type="submit">Log out ({{ session.admin_name }})</button>
    </form>
  </nav>
</div></header>
{% endif %}
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="flash {{ cat }}" role="status">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>
  Developed by NJUGUNA CHARLES
</footer>
</body>
</html>
